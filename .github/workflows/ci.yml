name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # DB・mykeiba に触れない検査だけ。check_entries / check_contention は pace_model 経由で
      # mykeiba が要るため、ローカルの `npm test` で実行する。
      - run: npm ci
      - run: npm run test:ci
